<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もぐらたたき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8ECAE6;
    --sky-bottom:#DFF6E3;
    --grass-1:#6FCB6F;
    --grass-2:#4CA64C;
    --dirt:#7A4A28;
    --dirt-dark:#5C3618;
    --mole-body:#A9745B;
    --mole-belly:#EAD1B0;
    --mole-nose:#F2A0A0;
    --accent:#FF6B6B;
    --accent-dark:#E25555;
    --gold:#FFC93C;
    --ink:#1B4332;
    --card:#FFFDF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  html,body{margin:0; height:100%; overscroll-behavior:none; touch-action:manipulation;}
  body{
    font-family:'Nunito', sans-serif;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass-2) 55%, var(--grass-1) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:manipulation;
  }
  .stage{
    width:min(480px, 96vw);
    padding:14px;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:10px;
  }
  .badge{
    background:var(--card);
    border-radius:18px;
    padding:8px 16px;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:72px;
  }
  .badge .label{font-size:11px; font-weight:800; color:#8a8a7a; letter-spacing:.05em;}
  .badge .value{font-family:'Baloo 2', sans-serif; font-size:26px; font-weight:800; color:var(--ink); line-height:1.1;}
  .badge .value.negative{ color:var(--accent-dark); }
  .badge.time .value{transition:color .2s;}
  .badge.time.low .value{color:var(--accent-dark);}
  .mute-btn{
    background:var(--card);
    border:none;
    border-radius:50%;
    width:44px; height:44px;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* ---------- Field ---------- */
  .field{
    position:relative;
    background:radial-gradient(circle at 50% 20%, #7FD37F 0%, var(--grass-1) 45%, var(--grass-2) 100%);
    border-radius:24px;
    padding:22px 16px;
    box-shadow:0 10px 0 rgba(0,0,0,0.15), inset 0 0 0 4px rgba(255,255,255,0.25);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    touch-action:manipulation;
  }
  .hole{
    position:relative;
    aspect-ratio:1/0.85;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, var(--dirt) 0%, var(--dirt-dark) 85%);
    box-shadow:inset 0 8px 14px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(255,255,255,0.08);
    overflow:hidden;
    cursor:pointer;
    touch-action:manipulation;
  }
  .tuft{
    position:absolute; bottom:-2px; width:22%; height:30%;
    background:var(--grass-1);
    border-radius:50% 50% 0 0;
  }
  .tuft.l{left:2%;} .tuft.r{right:2%; background:var(--grass-2);}

  .mole{
    position:absolute;
    left:50%; bottom:-90%;
    width:74%; height:78%;
    transform:translate(-50%, 0);
    transition:bottom .16s cubic-bezier(.34,1.56,.64,1);
  }
  .hole.up .mole{ bottom:6%; }
  .hole.hit .mole{ transition:transform .12s ease, bottom .12s ease; transform:translate(-50%,0) scaleY(.55); bottom:-10%; }

  .mole-body{
    position:absolute; inset:0;
    background:var(--mole-body);
    border-radius:50% 50% 45% 45%;
  }
  .mole.golden .mole-body{ background:var(--gold); }
  .mole-belly{
    position:absolute; left:50%; bottom:6%; width:56%; height:42%;
    transform:translateX(-50%);
    background:var(--mole-belly);
    border-radius:50%;
  }
  .mole.golden .mole-belly{ background:#FFF1C2; }
  .eye{
    position:absolute; top:26%; width:13%; height:13%;
    background:#2B2118; border-radius:50%;
  }
  .eye.l{left:26%;} .eye.r{right:26%;}
  .nose{
    position:absolute; top:44%; left:50%; width:16%; height:11%;
    background:var(--mole-nose); border-radius:50%;
    transform:translateX(-50%);
  }
  .sparkle{
    position:absolute; inset:-20%;
    pointer-events:none;
  }

  /* ---------- Bad mole (danger, don't tap!) ---------- */
  .mole.bad .mole-body{ background:#D6453F; }
  .mole.bad .mole-belly{ background:#F2B4AE; }
  .mole.bad .eye{ background:#1a0d0a; }
  .mole.bad::before{
    content:'';
    position:absolute; top:-16%; left:12%; width:76%; height:24%;
    background:#2B2118;
    clip-path:polygon(0% 100%,8% 0%,16% 100%,24% 0%,32% 100%,40% 0%,48% 100%,56% 0%,64% 100%,72% 0%,80% 100%,88% 0%,96% 100%,100% 100%);
  }
  .mole.bad::after{
    content:'';
  }
  .brow{ display:none; }

  .bad-warn{
    position:absolute;
    font-size:20px;
    transform:translate(-50%,0);
    pointer-events:none;
    z-index:24;
    animation:warnPop .25s ease;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,0.25));
  }
  @keyframes warnPop{
    0%{ transform:translate(-50%,0) scale(0.3); opacity:0; }
    70%{ transform:translate(-50%,0) scale(1.2); opacity:1; }
    100%{ transform:translate(-50%,0) scale(1); opacity:1; }
  }

  @keyframes shockShake{
    0%,100%{ transform:translate(-50%,0); filter:brightness(1); }
    15%{ transform:translate(calc(-50% - 4px),0); filter:brightness(2.2); }
    30%{ transform:translate(calc(-50% + 4px),0); filter:brightness(1); }
    45%{ transform:translate(calc(-50% - 3px),0); filter:brightness(2.2); }
    60%{ transform:translate(calc(-50% + 3px),0); filter:brightness(1); }
    75%{ transform:translate(calc(-50% - 2px),0); filter:brightness(2); }
    100%{ transform:translate(-50%,0); filter:brightness(1); }
  }
  .hole.hit .mole.bad{ animation:shockShake .4s ease; }
  .bolt{
    position:absolute; width:12px; height:20px; pointer-events:none;
    background:#FFE45C;
    clip-path:polygon(40% 0%,100% 0%,45% 45%,80% 45%,20% 100%,35% 50%,0% 50%);
    animation:boltFlash .4s ease forwards;
    z-index:6;
  }
  @keyframes boltFlash{
    0%{ opacity:1; transform:scale(.5) rotate(var(--rot,0deg)); }
    50%{ opacity:1; transform:scale(1.15) rotate(var(--rot,0deg)); }
    100%{ opacity:0; transform:scale(1) rotate(var(--rot,0deg)); }
  }

  .pop-score{
    position:absolute; top:0; left:0;
    transform:translate(-50%,0);
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:24px;
    color:var(--accent-dark);
    text-shadow:0 2px 0 #fff, 0 0 6px #fff;
    pointer-events:none;
    animation:floatUp .7s ease forwards;
    z-index:25;
    white-space:nowrap;
  }
  .pop-score.golden{ color:#B8860B; }
  .pop-score.bad{ color:#B71C1C; }
  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,0) scale(0.8); }
    30%{ transform:translate(-50%,-24px) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-62px) scale(1); }
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,50,30,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:40;
  }
  .overlay.hidden{display:none;}
  .panel{
    background:var(--card);
    border-radius:26px;
    padding:32px 26px;
    text-align:center;
    width:min(360px, 92vw);
    box-shadow:0 14px 0 rgba(0,0,0,0.2);
  }
  .panel h1{
    font-family:'Baloo 2', sans-serif;
    font-size:34px;
    color:var(--ink);
    margin:0 0 6px;
  }
  .panel p{
    color:#5b6b5e;
    font-weight:700;
    margin:0 0 20px;
    line-height:1.5;
  }
  .mole-icon{
    width:100px; height:80px;
    margin:0 auto 16px;
    position:relative;
  }
  .big-btn{
    font-family:'Baloo 2', sans-serif;
    font-size:22px;
    font-weight:800;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:18px;
    padding:14px 30px;
    box-shadow:0 6px 0 var(--accent-dark);
    cursor:pointer;
    width:100%;
  }
  .big-btn:active{ box-shadow:0 2px 0 var(--accent-dark); transform:translateY(4px); }

  .result-score{
    font-family:'Baloo 2', sans-serif;
    font-size:52px;
    color:var(--accent-dark);
    margin:6px 0 2px;
  }
  .result-best{
    font-size:15px;
    color:#8a8a7a;
    font-weight:800;
    margin-bottom:20px;
  }
  .new-best{
    color:var(--gold);
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    margin-bottom:10px;
  }

  @media (prefers-reduced-motion: reduce){
    .hole .mole, .big-btn, .pop-score{ transition:none; animation:none; }
  }
  .home-link{ position:fixed; top:12px; left:12px; z-index:30; background:var(--card); border-radius:14px;
    padding:8px 14px; font-weight:800; color:var(--ink); text-decoration:none; box-shadow:0 4px 0 rgba(0,0,0,0.12); font-size:14px; }
  .mode-badge{ position:fixed; top:12px; right:12px; z-index:30; border-radius:14px;
    padding:8px 14px; font-weight:800; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.12); font-size:13px; }

  .diff-label{ font-family:'Baloo 2', sans-serif; font-size:15px; color:var(--ink); margin:2px 0 10px; }
  .diff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .diff-btn{
    font-family:'Baloo 2', sans-serif; font-size:16px; font-weight:800; color:#fff;
    border:none; border-radius:14px; padding:12px 8px; cursor:pointer;
  }
  .diff-btn:active{ transform:translateY(3px); }
  .diff-btn.easy{ background:#5FBF6B; box-shadow:0 5px 0 #3D9A48; }
  .diff-btn.normal{ background:#4A90D9; box-shadow:0 5px 0 #2E6FB3; }
  .diff-btn.hard{ background:#E8934A; box-shadow:0 5px 0 #C06E28; }
  .diff-btn.expert{ background:#D6453F; box-shadow:0 5px 0 #A62A25; }
  .diff-btn small{ display:block; font-family:'Nunito', sans-serif; font-size:10px; font-weight:700; opacity:.9; margin-top:2px; }
</style>
</head>
<body>

<a class="home-link" href="index.html">🏠 メニュー</a>
<div class="mode-badge" id="modeBadge" style="display:none;"></div>

<div class="stage">
  <div class="hud">
    <div class="badge">
      <div class="label">スコア</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <button class="mute-btn" id="muteBtn" aria-label="おとをけす">🔊</button>
    <button class="mute-btn" id="restartBtn" aria-label="さいしょから やりなおす">🔄</button>
    <div class="badge time" id="timeBadge">
      <div class="label">じかん</div>
      <div class="value" id="timeVal">30</div>
    </div>
  </div>

  <div class="field">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- スタート画面 -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <div class="mole-icon">
      <div class="mole" style="position:absolute; left:50%; bottom:0; transform:translateX(-50%);">
        <div class="mole-body"></div>
        <div class="mole-belly"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="nose"></div>
      </div>
    </div>
    <h1>もぐらたたき</h1>
    <p>でてきたもぐらを<br>ゆびでタップしよう!</p>
    <div class="diff-label">なんいどを えらんでね</div>
    <div class="diff-grid">
      <button class="diff-btn easy" data-diff="easy">🟢 イージー<small>ゆっくり・やさしい</small></button>
      <button class="diff-btn normal" data-diff="normal">🔵 ノーマル<small>ふつう</small></button>
      <button class="diff-btn hard" data-diff="hard">🟠 ハード<small>はやい・ワナあり</small></button>
      <button class="diff-btn expert" data-diff="expert">🔴 エキスパート<small>おにモード</small></button>
    </div>
  </div>
</div>

<!-- 結果画面 -->
<!-- カウントダウン画面 -->
<div class="overlay hidden" id="countdownOverlay">
  <div class="panel" style="padding:44px 30px;">
    <div id="countdownText" style="font-family:'Baloo 2', sans-serif; font-size:38px; color:var(--ink);">よーい...</div>
  </div>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="panel">
    <h1 id="resultTitle">おわり!</h1>
    <p id="endingMsg" class="hidden" style="background:#F3F0E6; border-radius:14px; padding:10px 14px; font-size:13px; color:#4a5a4c; font-weight:700; line-height:1.7; margin:0 0 16px;"></p>
    <div class="result-score" id="finalScore">0</div>
    <div class="new-best hidden" id="newBestLabel">✨ さいこうきろく! ✨</div>
    <div class="result-best" id="bestLine">さいこう: 0</div>
    <button class="big-btn" id="retryBtn">もういちど</button>
    <div style="margin-top:12px;">
      <a href="#" id="changeDiffLink" style="font-weight:800; color:#8a8a7a; font-size:13px; text-decoration:underline;">なんいどをかえる</a>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 3, ROWS = 3, HOLE_COUNT = COLS * ROWS;
  const ROUND_MS = 30000;
  const BEST_KEY_PREFIX = 'mogura_best_score_v2_';

  const DIFFS = {
    easy:    { label:'🟢 イージー', color:'#5FBF6B', maxConcurrent:1, upMin:1000, upMax:1600, spawnMin:700,  spawnMax:1000, golden:0.20, bad:0,    badPoints:0 },
    normal:  { label:'🔵 ノーマル', color:'#4A90D9', maxConcurrent:2, upMin:750,  upMax:1300, spawnMin:480,  spawnMax:860,  golden:0.15, bad:0,    badPoints:0 },
    hard:    { label:'🟠 ハード',   color:'#E8934A', maxConcurrent:2, upMin:550,  upMax:950,  spawnMin:380,  spawnMax:650,  golden:0.12, bad:0.15, badPoints:-2 },
    expert:  { label:'🔴 エキスパート', color:'#D6453F', maxConcurrent:3, upMin:420,  upMax:750,  spawnMin:260,  spawnMax:480,  golden:0.10, bad:0.25, badPoints:-5 },
  };
  let currentDiff = 'normal';

  const grid = document.getElementById('grid');
  const scoreVal = document.getElementById('scoreVal');
  const timeVal = document.getElementById('timeVal');
  const timeBadge = document.getElementById('timeBadge');
  const startOverlay = document.getElementById('startOverlay');
  const resultOverlay = document.getElementById('resultOverlay');
  const retryBtn = document.getElementById('retryBtn');
  const muteBtn = document.getElementById('muteBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const bestLine = document.getElementById('bestLine');
  const newBestLabel = document.getElementById('newBestLabel');
  const modeBadge = document.getElementById('modeBadge');
  const changeDiffLink = document.getElementById('changeDiffLink');
  const field = document.querySelector('.field');
  const resultTitle = document.getElementById('resultTitle');
  const endingMsg = document.getElementById('endingMsg');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownText = document.getElementById('countdownText');
  let countdownTimer1 = null, countdownTimer2 = null;

  let holes = [];
  let score = 0;
  let timeLeft = ROUND_MS;
  let running = false;
  let muted = false;
  let spawnTimer = null;
  let tickTimer = null;
  let lastTick = 0;
  let badAppeared = 0;
  let badTapped = 0;
  let goodAppeared = 0;
  let goodTapped = 0;

  // ---- build holes ----
  for (let i = 0; i < HOLE_COUNT; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML = `
      <div class="tuft l"></div><div class="tuft r"></div>
      <div class="mole">
        <div class="mole-body"></div>
        <div class="mole-belly"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="nose"></div>
      </div>`;
    hole.dataset.state = 'empty';
    hole.dataset.golden = 'false';
    hole.addEventListener('pointerdown', (e) => { e.preventDefault(); onTap(hole); });
    grid.appendChild(hole);
    holes.push(hole);
  }

  // ---- sound (WebAudio, no external files) ----
  let actx = null;
  function ensureAudio(){ if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
  function beep(freq, dur, type='sine', gain=0.18){
    if (muted) return;
    ensureAudio();
    const t0 = actx.currentTime;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }
  function sfxHit(){ beep(520, 0.12, 'triangle', 0.22); }
  function sfxGolden(){ beep(660, 0.09,'sine',0.2); setTimeout(()=>beep(880,0.14,'sine',0.2), 70); }
  function sfxShock(){ beep(900, 0.04,'sawtooth',0.25); setTimeout(()=>beep(150,0.15,'sawtooth',0.22), 40); }
  function sfxCount(){ beep(440, 0.12, 'sine', 0.15); }
  function sfxStart(){ beep(392,0.1,'sine',0.15); setTimeout(()=>beep(523,0.12,'sine',0.15),100); }
  function sfxEnd(){ beep(330,0.15,'sine',0.18); setTimeout(()=>beep(220,0.25,'sine',0.18),150); }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  restartBtn.addEventListener('click', () => {
    if (!running) return;
    ensureAudio();
    startGame(currentDiff);
  });

  // ---- game flow ----
  function resetHole(hole){
    hole.dataset.state = 'empty';
    hole.dataset.variant = 'normal';
    hole.classList.remove('up','hit');
    hole.querySelector('.mole').classList.remove('golden','bad');
    clearTimeout(hole._hideTimer);
    if (hole._warnEl) { hole._warnEl.remove(); hole._warnEl = null; }
  }

  function showWarn(hole){
    const holeRect = hole.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const warn = document.createElement('div');
    warn.className = 'bad-warn';
    warn.textContent = '⚠️';
    warn.style.left = (holeRect.left - fieldRect.left + holeRect.width / 2) + 'px';
    warn.style.top = (holeRect.top - fieldRect.top - 22) + 'px';
    field.appendChild(warn);
    hole._warnEl = warn;
  }

  function popMole(hole){
    if (!running) return;
    if (hole.dataset.state !== 'empty') return;
    const cfg = DIFFS[currentDiff];
    const r = Math.random();
    let variant = 'normal';
    if (r < cfg.bad) variant = 'bad';
    else if (r < cfg.bad + cfg.golden) variant = 'golden';

    hole.dataset.state = 'up';
    hole.dataset.variant = variant;
    hole.classList.add('up');
    if (variant === 'bad') { badAppeared++; showWarn(hole); }
    else { goodAppeared++; }
    const moleEl = hole.querySelector('.mole');
    moleEl.classList.toggle('golden', variant === 'golden');
    moleEl.classList.toggle('bad', variant === 'bad');
    const upTime = cfg.upMin + Math.random() * (cfg.upMax - cfg.upMin);
    hole._hideTimer = setTimeout(() => {
      if (hole.dataset.state === 'up') resetHole(hole);
    }, upTime);
  }

  function showPop(hole, text, cls){
    const holeRect = hole.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop-score' + (cls ? ' ' + cls : '');
    pop.textContent = text;
    pop.style.left = (holeRect.left - fieldRect.left + holeRect.width / 2) + 'px';
    pop.style.top = (holeRect.top - fieldRect.top) + 'px';
    field.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  function showShock(hole){
    const holeRect = hole.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const cx = holeRect.left - fieldRect.left + holeRect.width / 2;
    const cy = holeRect.top - fieldRect.top + holeRect.height * 0.35;
    for (let i = 0; i < 3; i++) {
      const bolt = document.createElement('div');
      bolt.className = 'bolt';
      const angle = -50 + i * 50 + (Math.random() * 16 - 8);
      const dist = 22 + Math.random() * 8;
      bolt.style.left = (cx + Math.cos(angle * Math.PI/180) * dist - 6) + 'px';
      bolt.style.top = (cy - Math.sin(angle * Math.PI/180) * dist - 10) + 'px';
      bolt.style.setProperty('--rot', (angle + 90) + 'deg');
      field.appendChild(bolt);
      setTimeout(() => bolt.remove(), 420);
    }
  }

  function onTap(hole){
    if (!running) return;
    if (hole.dataset.state !== 'up') return;
    const variant = hole.dataset.variant;
    const cfg = DIFFS[currentDiff];
    const points = variant === 'golden' ? 3 : (variant === 'bad' ? cfg.badPoints : 1);
    score += points; // negative totals are allowed
    scoreVal.textContent = score;
    scoreVal.classList.toggle('negative', score < 0);

    showPop(hole, (points > 0 ? '+' : '') + points, variant === 'golden' ? 'golden' : (variant === 'bad' ? 'bad' : ''));

    hole.classList.add('hit');
    if (variant === 'golden') {
      goodTapped++;
      sfxGolden();
    } else if (variant === 'bad') {
      badTapped++;
      sfxShock();
      showShock(hole);
    } else {
      goodTapped++;
      sfxHit();
    }
    clearTimeout(hole._hideTimer);
    setTimeout(() => resetHole(hole), 140);
  }

  function spawnLoop(){
    if (!running) return;
    const cfg = DIFFS[currentDiff];
    const activeCount = holes.filter(h => h.dataset.state === 'up').length;
    if (activeCount < cfg.maxConcurrent && Math.random() < 0.85) {
      const empties = holes.filter(h => h.dataset.state === 'empty');
      if (empties.length) {
        const h = empties[Math.floor(Math.random() * empties.length)];
        popMole(h);
      }
    }
    spawnTimer = setTimeout(spawnLoop, cfg.spawnMin + Math.random() * (cfg.spawnMax - cfg.spawnMin));
  }

  function tick(ts){
    if (!running) return;
    if (!lastTick) lastTick = ts;
    const dt = ts - lastTick;
    lastTick = ts;
    timeLeft -= dt;
    const secs = Math.max(0, Math.ceil(timeLeft / 1000));
    timeVal.textContent = secs;
    timeBadge.classList.toggle('low', secs <= 10);
    if (timeLeft <= 0) {
      endGame();
      return;
    }
    tickTimer = requestAnimationFrame(tick);
  }

  function prepRound(diff){
    if (diff) currentDiff = diff;
    const cfg = DIFFS[currentDiff];
    modeBadge.textContent = cfg.label;
    modeBadge.style.background = cfg.color;
    modeBadge.style.display = 'block';

    score = 0;
    scoreVal.textContent = '0';
    scoreVal.classList.remove('negative');
    badAppeared = 0;
    badTapped = 0;
    goodAppeared = 0;
    goodTapped = 0;
    timeLeft = ROUND_MS;
    timeVal.textContent = Math.ceil(ROUND_MS/1000);
    timeBadge.classList.remove('low');
    holes.forEach(resetHole);
  }

  function beginRound(){
    running = true;
    lastTick = 0;
    spawnLoop();
    tickTimer = requestAnimationFrame(tick);
  }

  function startGame(diff){
    // "よーい...スタート!" の余韻を挟んでから本編を開始する
    prepRound(diff);
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    countdownOverlay.classList.remove('hidden');
    countdownText.textContent = 'よーい...';
    sfxCount();
    clearTimeout(countdownTimer1);
    clearTimeout(countdownTimer2);
    countdownTimer1 = setTimeout(() => {
      countdownText.textContent = 'スタート!';
      sfxStart();
      countdownTimer2 = setTimeout(() => {
        countdownOverlay.classList.add('hidden');
        beginRound();
      }, 480);
    }, 700);
  }

  function endGame(){
    running = false;
    clearTimeout(spawnTimer);
    cancelAnimationFrame(tickTimer);
    holes.forEach(resetHole);

    // トゥルー/裏エンディングは「なにもしない」だけでは達成できないよう、
    // 良いもぐらを実際に全部捕まえていること(goodTapped===goodAppeared)を条件にする
    let ending = 'normal';
    const caughtAllGood = goodAppeared > 0 && goodTapped === goodAppeared;
    const zappedAllBad = badAppeared > 0 && badTapped === badAppeared;
    if (badAppeared > 0 && badTapped === 0 && caughtAllGood) ending = 'true';
    else if (zappedAllBad && goodTapped === 0 && goodAppeared > 0) ending = 'hidden';

    if (ending === 'true') {
      sfxGolden();
      resultTitle.textContent = '🌿 みんなともだち';
      endingMsg.textContent = 'じつは たたいた もぐらたちは、かくれんぼで かくれていた ともだちだったんだ。にせもの(あかい もぐら)には だまされず、ほんもの だけを ぜんいん みつけてあげたね!';
      endingMsg.classList.remove('hidden');
    } else if (ending === 'hidden') {
      sfxGolden();
      resultTitle.textContent = '👑 わんぱくキング';
      endingMsg.textContent = 'にせものだって わかってて、ぜんぶ わざと からかっちゃった!? きみは もう こわいものなし!';
      endingMsg.classList.remove('hidden');
    } else {
      sfxEnd();
      resultTitle.textContent = 'おわり!';
      endingMsg.classList.add('hidden');
    }

    const bestKey = BEST_KEY_PREFIX + currentDiff;
    const best = Number(localStorage.getItem(bestKey) || 0);
    const isNewBest = score > best;
    if (isNewBest) localStorage.setItem(bestKey, String(score));

    finalScore.textContent = score;
    finalScore.style.color = score < 0 ? 'var(--accent-dark)' : '';
    bestLine.textContent = DIFFS[currentDiff].label + ' さいこう: ' + (isNewBest ? score : best);
    newBestLabel.classList.toggle('hidden', !isNewBest);
    resultOverlay.classList.remove('hidden');
  }

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => { ensureAudio(); startGame(btn.dataset.diff); });
  });
  retryBtn.addEventListener('click', () => { ensureAudio(); startGame(); });
  changeDiffLink.addEventListener('click', (e) => {
    e.preventDefault();
    resultOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  // extra safety net against double-tap-to-zoom / text-selection on rapid taps
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive:false });
})();
</script>
</body>
</html>
