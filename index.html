<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もぐらゲームランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8ECAE6; --sky-bottom:#DFF6E3;
    --grass-1:#6FCB6F; --grass-2:#4CA64C;
    --mole-body:#A9745B; --mole-belly:#EAD1B0; --mole-nose:#F2A0A0;
    --accent:#FF6B6B; --accent-dark:#E25555;
    --gold:#FFC93C; --ink:#1B4332; --card:#FFFDF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; min-height:100%;}
  body{
    font-family:'Nunito', sans-serif;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass-2) 55%, var(--grass-1) 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 14px;
  }
  .wrap{ width:min(520px, 100%); }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:clamp(30px, 8vw, 42px);
    color:var(--ink);
    text-align:center;
    margin:4px 0 4px;
    text-shadow:0 3px 0 rgba(255,255,255,0.5);
  }
  .sub{ text-align:center; color:#2f5236; font-weight:800; margin:0 0 26px; opacity:.85; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:420px){ .cards{ grid-template-columns:1fr; } }
  .card{
    background:var(--card);
    border-radius:26px;
    padding:20px 16px 22px;
    text-align:center;
    text-decoration:none;
    box-shadow:0 10px 0 rgba(0,0,0,0.15);
    display:block;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,0.15); }
  .art{ width:110px; height:90px; margin:0 auto 10px; position:relative; }
  .card h2{
    font-family:'Baloo 2', sans-serif;
    font-size:22px; color:var(--ink); margin:6px 0 4px;
  }
  .card p{ font-size:13px; color:#5b6b5e; font-weight:700; margin:0 0 12px; line-height:1.5; }
  .play-tag{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-size:15px; color:#fff; background:var(--accent);
    border-radius:12px; padding:8px 18px;
    box-shadow:0 4px 0 var(--accent-dark);
  }

  /* mole art (whack-a-mole card) */
  .hole-mini{ position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:88px; height:40px; background:radial-gradient(ellipse at 50% 30%, #7A4A28 0%, #5C3618 85%);
    border-radius:50%; }
  .mole-mini{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:56px; height:56px; }
  .mole-mini .body{ position:absolute; inset:0; background:var(--mole-body); border-radius:50% 50% 45% 45%; }
  .mole-mini .belly{ position:absolute; left:50%; bottom:8%; width:56%; height:40%; transform:translateX(-50%); background:var(--mole-belly); border-radius:50%; }
  .mole-mini .eye{ position:absolute; top:22%; width:12%; height:12%; background:#2B2118; border-radius:50%; }
  .mole-mini .eye.l{ left:24%; } .mole-mini .eye.r{ right:24%; }
  .mole-mini .nose{ position:absolute; top:40%; left:50%; width:14%; height:10%; background:var(--mole-nose); border-radius:50%; transform:translateX(-50%); }

  /* jump art (jump card) */
  .ground-mini{ position:absolute; bottom:0; left:0; right:0; height:16px; background:var(--grass-2); border-radius:0 0 8px 8px; }
  .rock-mini{ position:absolute; bottom:16px; right:10px; width:26px; height:22px; background:#8B8378; border-radius:50%; }
  .jumper{ position:absolute; bottom:16px; left:18px; width:50px; height:50px; animation:hop 1.1s ease-in-out infinite; }
  .jumper .body{ position:absolute; inset:0; background:var(--mole-body); border-radius:50% 50% 45% 45%; }
  .jumper .belly{ position:absolute; left:50%; bottom:8%; width:56%; height:40%; transform:translateX(-50%); background:var(--mole-belly); border-radius:50%; }
  .jumper .eye{ position:absolute; top:22%; width:12%; height:12%; background:#2B2118; border-radius:50%; }
  .jumper .eye.l{ left:24%; } .jumper .eye.r{ right:24%; }
  .jumper .nose{ position:absolute; top:40%; left:50%; width:14%; height:10%; background:var(--mole-nose); border-radius:50%; transform:translateX(-50%); }
  @keyframes hop{
    0%,100%{ transform:translateY(0); }
    35%{ transform:translateY(-30px); }
    55%{ transform:translateY(-30px); }
    80%{ transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){ .jumper{ animation:none; } }

  /* maze card art */
  .cave-mini{ position:absolute; inset:0; border-radius:16px;
    background:radial-gradient(circle at 50% 40%, #4a3323 0%, #1c130c 100%); }
  .path-mini{ position:absolute; bottom:8px; width:16px; height:40px; background:#C9A876; border-radius:6px; }
  .path-mini.l{ left:26px; transform:rotate(18deg); }
  .path-mini.r{ right:26px; transform:rotate(-18deg); }
  .path-mini.c{ left:50%; bottom:44px; height:26px; transform:translateX(-50%); }
  .x-mini{ position:absolute; bottom:44px; left:26px; color:#B71C1C; font-weight:800; font-size:14px; }
</style>
<!-- ファビコン -->
<link rel="icon" type="image/png" href="icon.png">

<!-- iOSのホーム画面追加用 -->
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div class="wrap">
  <h1>もぐらゲームランド</h1>
  <p class="sub">あそびたいゲームをタップしてね</p>

  <div class="cards">
    <a class="card" href="mogura-tataki.html">
      <div class="art">
        <div class="hole-mini"></div>
        <div class="mole-mini">
          <div class="body"></div><div class="belly"></div>
          <div class="eye l"></div><div class="eye r"></div><div class="nose"></div>
        </div>
      </div>
      <h2>もぐらたたき</h2>
      <p>出てきたもぐらをタップ!<br>30びょうで何びき たたけるかな</p>
      <span class="play-tag">▶ あそぶ</span>
    </a>

    <a class="card" href="mogura-jump.html">
      <div class="art">
        <div class="ground-mini"></div>
        <div class="rock-mini"></div>
        <div class="jumper">
          <div class="body"></div><div class="belly"></div>
          <div class="eye l"></div><div class="eye r"></div><div class="nose"></div>
        </div>
      </div>
      <h2>もぐらジャンプ</h2>
      <p>タップでジャンプ!<br>アイテムを取って とおくまで走ろう</p>
      <span class="play-tag">▶ あそぶ</span>
    </a>

    <a class="card" href="mogura-meiro.html">
      <div class="art">
        <div class="cave-mini"></div>
        <div class="path-mini c"></div>
        <div class="path-mini l"></div>
        <div class="path-mini r"></div>
        <div class="x-mini">✕</div>
      </div>
      <h2>もぐらめいろ</h2>
      <p>道は何本も見えるけど正解は1つ!<br>ワナを見ぬいてゴールを目指そう</p>
      <span class="play-tag">▶ あそぶ</span>
    </a>
  </div>
</div>
</body>
</html>
