<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もぐらめいろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-1:#5b4028; --soil-2:#2a1c11; --path:#C9A876; --path-edge:#8B6A42;
    --accent:#FF6B6B; --accent-dark:#E25555;
    --gold:#FFC93C; --ink:#1B4332; --card:#FFFDF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  html,body{margin:0; height:100%; overscroll-behavior:none; touch-action:manipulation;}
  body{
    font-family:'Nunito', sans-serif;
    background:radial-gradient(circle at 50% 30%, #4a3323 0%, #1c130c 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:manipulation;
  }
  .stage{ width:min(480px, 96vw); padding:14px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  .badge{
    background:var(--card); border-radius:16px; padding:7px 12px;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
    display:flex; flex-direction:column; align-items:center; min-width:64px;
  }
  .badge .label{ font-size:10px; font-weight:800; color:#8a8a7a; letter-spacing:.03em; }
  .badge .value{ font-family:'Baloo 2', sans-serif; font-size:21px; font-weight:800; color:var(--ink); line-height:1.1; }
  .mute-btn{
    background:var(--card); border:none; border-radius:50%;
    width:40px; height:40px; box-shadow:0 4px 0 rgba(0,0,0,0.25);
    font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .field{ position:relative; border-radius:24px; overflow:hidden;
    box-shadow:0 10px 0 rgba(0,0,0,0.3), inset 0 0 0 4px rgba(255,255,255,0.12); line-height:0; }
  canvas{ display:block; width:100%; height:auto; touch-action:manipulation; }

  .overlay{ position:fixed; inset:0; background:rgba(10,6,3,0.6);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:40; }
  .overlay.hidden{ display:none; }
  .panel{ background:var(--card); border-radius:26px; padding:30px 26px; text-align:center;
    width:min(370px, 92vw); box-shadow:0 14px 0 rgba(0,0,0,0.3); max-height:90vh; overflow:auto; }
  .panel h1{ font-family:'Baloo 2', sans-serif; font-size:28px; color:var(--ink); margin:0 0 6px; }
  .panel p{ color:#5b6b5e; font-weight:700; margin:0 0 14px; line-height:1.55; font-size:14px; }
  .howto{ text-align:left; background:#F3F0E6; border-radius:14px; padding:10px 14px; margin-bottom:16px; font-size:13px; color:#4a5a4c; font-weight:700; line-height:1.7; }
  .howto b{ color:var(--ink); }
  .big-btn{ font-family:'Baloo 2', sans-serif; font-size:22px; font-weight:800; color:#fff;
    background:var(--accent); border:none; border-radius:18px; padding:14px 30px;
    box-shadow:0 6px 0 var(--accent-dark); cursor:pointer; width:100%; }
  .big-btn:active{ box-shadow:0 2px 0 var(--accent-dark); transform:translateY(4px); }
  .result-score{ font-family:'Baloo 2', sans-serif; font-size:40px; color:var(--accent-dark); margin:4px 0 2px; }
  .result-best{ font-size:14px; color:#8a8a7a; font-weight:800; margin-bottom:18px; }
  .new-best{ color:var(--gold); font-family:'Baloo 2', sans-serif; font-size:16px; margin-bottom:8px; }

  .diff-label{ font-family:'Baloo 2', sans-serif; font-size:15px; color:var(--ink); margin:2px 0 10px; }
  .diff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .diff-btn{
    font-family:'Baloo 2', sans-serif; font-size:16px; font-weight:800; color:#fff;
    border:none; border-radius:14px; padding:12px 8px; cursor:pointer;
  }
  .diff-btn:active{ transform:translateY(3px); }
  .diff-btn.easy{ background:#5FBF6B; box-shadow:0 5px 0 #3D9A48; }
  .diff-btn.normal{ background:#4A90D9; box-shadow:0 5px 0 #2E6FB3; }
  .diff-btn.hard{ background:#E8934A; box-shadow:0 5px 0 #C06E28; }
  .diff-btn.expert{ background:#D6453F; box-shadow:0 5px 0 #A62A25; }
  .diff-btn small{ display:block; font-family:'Nunito', sans-serif; font-size:10px; font-weight:700; opacity:.9; margin-top:2px; }

  .home-link{ position:fixed; top:12px; left:12px; z-index:41; background:var(--card); border-radius:14px;
    padding:8px 14px; font-weight:800; color:var(--ink); text-decoration:none; box-shadow:0 4px 0 rgba(0,0,0,0.25); font-size:14px; }
  .mode-badge{ position:fixed; top:12px; right:12px; z-index:41; border-radius:14px;
    padding:8px 14px; font-weight:800; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.25); font-size:13px; }
</style>
</head>
<body>

<a class="home-link" href="index.html">🏠 メニュー</a>
<div class="mode-badge" id="modeBadge" style="display:none;"></div>

<div class="stage">
  <div class="hud">
    <div class="badge"><div class="label">タイム</div><div class="value" id="timeVal">0.0</div></div>
    <button class="mute-btn" id="muteBtn" aria-label="おとをけす">🔊</button>
    <button class="mute-btn" id="restartBtn" aria-label="さいしょから やりなおす">🔄</button>
    <div class="badge"><div class="label">さいこう</div><div class="value" id="bestVal">--</div></div>
  </div>
  <div class="field"><canvas id="game" width="480" height="360"></canvas></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>もぐらめいろ</h1>
    <div class="howto">
      <div>👉 いくつも道が見えるけど、<b>正解は1本だけ</b></div>
      <div>👉 分かれ道でどちらかの道を<b>タップ</b></div>
      <div>👉 ワナの道は 手前まで来ると<b>ワナが発動</b>して引き返す</div>
      <div>👉 ゴールまでの<b>タイムを きそおう</b></div>
      <div>👉 10びょう なやんでいると、正解ルートが少し光るよ</div>
    </div>
    <div class="diff-label">なんいどを えらんでね</div>
    <div class="diff-grid">
      <button class="diff-btn easy" data-diff="easy">🟢 イージー<small>3つの分かれ道</small></button>
      <button class="diff-btn normal" data-diff="normal">🔵 ノーマル<small>4つの分かれ道</small></button>
      <button class="diff-btn hard" data-diff="hard">🟠 ハード<small>5つ・3また あり</small></button>
      <button class="diff-btn expert" data-diff="expert">🔴 エキスパート<small>6つ・3また 多め</small></button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="countdownOverlay">
  <div class="panel" style="padding:44px 30px;">
    <div id="countdownText" style="font-family:'Baloo 2', sans-serif; font-size:38px; color:var(--ink);">よーい...</div>
  </div>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="panel">
    <h1 id="resultTitle">ゴール!</h1>
    <div class="result-score" id="finalTime">0.0びょう</div>
    <div class="new-best hidden" id="newBestLabel">✨ さいこうきろく! ✨</div>
    <div class="result-best" id="bestLine">さいこう: --</div>
    <button class="big-btn" id="retryBtn">もういちど</button>
    <div style="margin-top:12px;">
      <a href="#" id="changeDiffLink" style="font-weight:800; color:#8a8a7a; font-size:13px; text-decoration:underline;">なんいどをかえる</a>
    </div>
  </div>
</div>

<script>
(() => {
  const BEST_KEY_PREFIX = 'mogura_meiro_best_time_v1_';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const field = document.querySelector('.field');

  const timeVal = document.getElementById('timeVal');
  const bestVal = document.getElementById('bestVal');
  const modeBadge = document.getElementById('modeBadge');
  const startOverlay = document.getElementById('startOverlay');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownText = document.getElementById('countdownText');
  const resultOverlay = document.getElementById('resultOverlay');
  const finalTime = document.getElementById('finalTime');
  const bestLine = document.getElementById('bestLine');
  const newBestLabel = document.getElementById('newBestLabel');
  const retryBtn = document.getElementById('retryBtn');
  const changeDiffLink = document.getElementById('changeDiffLink');
  const muteBtn = document.getElementById('muteBtn');
  const restartBtn = document.getElementById('restartBtn');

  let muted = false;

  // ---------------- sound ----------------
  let actx = null;
  function ensureAudio(){ if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
  function beep(freq, dur, type='sine', gain=0.18, delay=0){
    if (muted) return;
    ensureAudio();
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator(); const g = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g).connect(actx.destination); osc.start(t0); osc.stop(t0 + dur);
  }
  const sfxCount = () => beep(440, 0.12, 'sine', 0.15);
  const sfxStart = () => { beep(392,0.1,'sine',0.15); beep(523,0.12,'sine',0.15,0.1); };
  const sfxTrap = () => { beep(200,0.1,'sawtooth',0.2); beep(120,0.2,'sawtooth',0.18,0.08); };
  const sfxStep = () => beep(320, 0.03, 'triangle', 0.05);
  const sfxGoal = () => { beep(523,0.1,'sine',0.18); beep(659,0.1,'sine',0.18,0.1); beep(784,0.1,'sine',0.18,0.2); beep(1046,0.18,'sine',0.18,0.3); };
  const sfxHint = () => beep(880, 0.08, 'sine', 0.1);

  muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; });

  // ---------------- maze generation ----------------
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function choice(arr){ return arr[randInt(0, arr.length-1)]; }
  const TRAP_TYPES = ['pit','wall','boulder'];

  const DIFFS = {
    easy:   { label:'🟢 イージー', color:'#5FBF6B', junctions:3, branchesRange:[2,2], decoyLenRange:[1,1], segLen:3 },
    normal: { label:'🔵 ノーマル', color:'#4A90D9', junctions:4, branchesRange:[2,2], decoyLenRange:[1,2], segLen:3 },
    hard:   { label:'🟠 ハード',   color:'#E8934A', junctions:5, branchesRange:[2,3], decoyLenRange:[2,3], segLen:3 },
    expert: { label:'🔴 エキスパート', color:'#D6453F', junctions:6, branchesRange:[2,3], decoyLenRange:[2,4], segLen:3 },
  };
  let currentDiff = 'normal';
  const BRANCH_VISUAL_LEN = 4; // decoys always *look* this long so they never visually give themselves away

  function generateMaze(cfg){
    const junctions = [];
    let col = 0, row = 0;
    const segments = [];
    const truePathCells = [{ row:0, col:0 }];

    for (let j=0; j<cfg.junctions; j++){
      segments.push({ fromRow: row, toRow: row+cfg.segLen, col });
      for (let r=row+1; r<=row+cfg.segLen; r++) truePathCells.push({ row:r, col });
      row += cfg.segLen;
      const junctionRow = row;

      const options = [-1,0,1].map(d => col+d).filter(c => Math.abs(c) <= 3);
      const trueCol = choice(options);
      const branchCount = randInt(cfg.branchesRange[0], cfg.branchesRange[1]);
      const branches = [{ col: trueCol, isTrue:true }];
      const takenCols = new Set([trueCol]);
      let guard = 0;
      while (branches.length < branchCount && guard < 30){
        guard++;
        const d = choice([-2,-1,1,2]);
        const c = col + d;
        if (takenCols.has(c) || Math.abs(c) > 3) continue;
        takenCols.add(c);
        const decoyLen = randInt(cfg.decoyLenRange[0], cfg.decoyLenRange[1]);
        branches.push({ col:c, isTrue:false, decoyLen, trapType: choice(TRAP_TYPES), revealed:false });
      }
      junctions.push({ row: junctionRow, branches });
      col = trueCol;
    }
    const finalLen = cfg.segLen;
    segments.push({ fromRow: row, toRow: row+finalLen, col });
    for (let r=row+1; r<=row+finalLen; r++) truePathCells.push({ row:r, col });
    row += finalLen;
    return { segments, junctions, goalRow: row, truePathCells };
  }

  // ---------------- state ----------------
  let maze = null;
  let phase = 'idle'; // idle | auto | choose | branching | trapped | retreating | finished
  let curRow = 0, curCol = 0;       // animated (float) position
  let animFrom = null, animTo = null, animStart = 0, animDur = 0;
  let activeJunctionIndex = 0;
  let activeSegmentIndex = 0;
  let activeBranch = null;
  let elapsedMs = 0, running = false;
  let lastFrameTs = 0;
  let idleTimerStart = 0;
  let hintActive = false;
  let raf = null;
  let countdownTimer1 = null, countdownTimer2 = null;
  let branchStepsWalked = 0;
  let pendingAfterTrueStep = null;

  const ROW_MS = 520;

  function startAnim(fromRC, toRC, dur){
    animFrom = fromRC; animTo = toRC; animStart = performance.now(); animDur = dur;
  }

  function resetRun(diff){
    if (diff) currentDiff = diff;
    const cfg = DIFFS[currentDiff];
    modeBadge.textContent = cfg.label;
    modeBadge.style.background = cfg.color;
    modeBadge.style.display = 'block';
    maze = generateMaze(cfg);
    phase = 'idle';
    curRow = 0; curCol = 0;
    activeJunctionIndex = 0; activeSegmentIndex = 0; activeBranch = null;
    elapsedMs = 0; running = false;
    branchStepsWalked = 0; pendingAfterTrueStep = null;
    timeVal.textContent = '0.0';
    const best = localStorage.getItem(BEST_KEY_PREFIX+currentDiff);
    bestVal.textContent = best ? (Number(best)/1000).toFixed(1) : '--';
    hintActive = false;
  }

  function startGame(diff){
    resetRun(diff);
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    countdownOverlay.classList.remove('hidden');
    countdownText.textContent = 'よーい...';
    sfxCount();
    clearTimeout(countdownTimer1); clearTimeout(countdownTimer2);
    countdownTimer1 = setTimeout(() => {
      countdownText.textContent = 'スタート!';
      sfxStart();
      countdownTimer2 = setTimeout(() => {
        countdownOverlay.classList.add('hidden');
        beginRun();
      }, 480);
    }, 700);
  }

  function beginRun(){
    running = true;
    elapsedMs = 0;
    lastFrameTs = 0;
    beginSegment(0);
    raf = requestAnimationFrame(loop);
  }

  function beginSegment(segIndex){
    activeSegmentIndex = segIndex;
    const seg = maze.segments[segIndex];
    phase = 'auto';
    startAnim({row:seg.fromRow, col:seg.col}, {row:seg.toRow, col:seg.col}, (seg.toRow-seg.fromRow)*ROW_MS);
  }

  function arriveAtJunction(jIndex){
    activeJunctionIndex = jIndex;
    phase = 'choose';
    idleTimerStart = performance.now();
    hintActive = false;
  }

  function chooseBranch(branch){
    if (phase !== 'choose') return;
    hintActive = false;
    activeBranch = branch;
    const j = maze.junctions[activeJunctionIndex];
    branchStepsWalked = 0;
    if (branch.isTrue) {
      phase = 'auto';
      activeSegmentIndex = activeSegmentIndex + 1;
      const nextSeg = maze.segments[activeSegmentIndex];
      pendingAfterTrueStep = () => {
        startAnim({row:curRow, col:curCol}, {row:nextSeg.toRow, col:nextSeg.col}, (nextSeg.toRow-curRow)*ROW_MS);
      };
      startAnim({row:j.row, col:curCol}, {row:j.row+1, col:branch.col}, ROW_MS);
    } else {
      phase = 'branching';
      startAnim({row:j.row, col:curCol}, {row:j.row+1, col:branch.col}, ROW_MS);
    }
  }

  function loop(ts){
    if (!running) return;
    if (!lastFrameTs) lastFrameTs = ts;
    const dt = ts - lastFrameTs;
    lastFrameTs = ts;
    elapsedMs += dt;
    timeVal.textContent = (elapsedMs/1000).toFixed(1);

    updateAnim(ts);
    checkHint(ts);
    render();

    raf = requestAnimationFrame(loop);
  }

  function updateAnim(ts){
    if (!animFrom) return;
    const t = Math.min(1, (ts - animStart) / animDur);
    curRow = animFrom.row + (animTo.row - animFrom.row) * t;
    curCol = animFrom.col + (animTo.col - animFrom.col) * t;
    if (t >= 1) {
      curRow = animTo.row; curCol = animTo.col;
      animFrom = null;
      onAnimComplete();
    }
  }

  function onAnimComplete(){
    if (phase === 'auto') {
      if (Math.round(curRow) >= maze.goalRow) { finishRun(); return; }
      if (pendingAfterTrueStep) { const fn = pendingAfterTrueStep; pendingAfterTrueStep = null; fn(); return; }
      const jIdx = maze.junctions.findIndex(j => j.row === Math.round(curRow));
      if (jIdx !== -1 && jIdx >= activeJunctionIndex) { sfxStep(); arriveAtJunction(jIdx); return; }
      sfxStep();
    } else if (phase === 'branching') {
      branchStepsWalked++;
      const targetSteps = activeBranch.decoyLen;
      if (branchStepsWalked >= targetSteps) {
        triggerTrap();
      } else {
        sfxStep();
        startAnim({row:curRow, col:curCol}, {row:curRow+1, col:curCol}, ROW_MS);
      }
    } else if (phase === 'retreating') {
      branchStepsWalked = 0;
      activeBranch.revealed = true;
      arriveAtJunction(activeJunctionIndex);
    }
  }

  function triggerTrap(){
    phase = 'trapped';
    sfxTrap();
    setTimeout(() => {
      phase = 'retreating';
      const j = maze.junctions[activeJunctionIndex];
      const seg = maze.segments[activeJunctionIndex];
      startAnim({row:curRow, col:curCol}, {row:j.row, col:seg.col}, ROW_MS);
    }, 650);
  }

  function checkHint(ts){
    if (phase !== 'choose') { hintActive = false; return; }
    if (ts - idleTimerStart >= 10000) {
      if (!hintActive) sfxHint();
      hintActive = true;
    }
  }

  function finishRun(){
    running = false;
    cancelAnimationFrame(raf);
    sfxGoal();
    setTimeout(() => showResult(), 500);
  }

  function showResult(){
    const bestKey = BEST_KEY_PREFIX + currentDiff;
    const best = Number(localStorage.getItem(bestKey) || 0);
    const isNewBest = best === 0 || elapsedMs < best;
    if (isNewBest) localStorage.setItem(bestKey, String(Math.round(elapsedMs)));
    finalTime.textContent = (elapsedMs/1000).toFixed(1) + 'びょう';
    bestLine.textContent = DIFFS[currentDiff].label + ' さいこう: ' + ((isNewBest ? elapsedMs : best)/1000).toFixed(1) + 'びょう';
    newBestLabel.classList.toggle('hidden', !isNewBest);
    bestVal.textContent = ((isNewBest ? elapsedMs : best)/1000).toFixed(1);
    resultOverlay.classList.remove('hidden');
  }

  // ---------------- rendering ----------------
  const ROW_H = 42, COL_W = 54;
  const MOLE_SCREEN_Y = H*0.8;

  function screenX(col){ return W/2 + col*COL_W; }
  function screenY(row){ return MOLE_SCREEN_Y - (row - curRow)*ROW_H; }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCorridorCell(cx, cy, revealedBad){
    ctx.fillStyle = revealedBad ? '#4a3020' : '#C9A876';
    roundRect(cx-COL_W*0.38, cy-ROW_H*0.55, COL_W*0.76, ROW_H*1.05, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2; ctx.stroke();
    if (revealedBad) {
      ctx.strokeStyle = '#B71C1C'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx-14, cy-14); ctx.lineTo(cx+14, cy+14);
      ctx.moveTo(cx+14, cy-14); ctx.lineTo(cx-14, cy+14);
      ctx.stroke();
    }
  }

  function drawBackground(){
    const bg = ctx.createRadialGradient(W/2, H*0.4, 10, W/2, H*0.4, W*0.85);
    bg.addColorStop(0, '#5b4028'); bg.addColorStop(0.65, '#2a1c11'); bg.addColorStop(1, '#140d08');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  }

  function drawGoalIfVisible(){
    if (!maze) return;
    if (maze.goalRow - curRow > BRANCH_VISUAL_LEN+1) return;
    const trueEnd = maze.truePathCells[maze.truePathCells.length-1];
    const cx = screenX(trueEnd.col), cy = screenY(maze.goalRow);
    if (cy < -40 || cy > H+40) return;
    const glow = ctx.createRadialGradient(cx,cy,2,cx,cy,50);
    glow.addColorStop(0, 'rgba(255,217,138,0.8)'); glow.addColorStop(1, 'rgba(255,217,138,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx,cy,50,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFFDF7'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🏁', cx, cy+8);
  }

  function drawStraightAhead(){
    const seg = maze.segments[activeSegmentIndex];
    if (!seg) return;
    const startRow = Math.floor(curRow);
    const endRow = Math.min(seg.toRow, startRow + BRANCH_VISUAL_LEN);
    for (let r = startRow; r <= endRow; r++){
      const cy = screenY(r);
      if (cy < -30 || cy > H+30) continue;
      drawCorridorCell(screenX(seg.col), cy, false);
    }
  }

  function drawJunctionBranches(j, highlight){
    const baseRow = j.row;
    for (const b of j.branches) {
      for (let step = 1; step <= BRANCH_VISUAL_LEN; step++) {
        const r = baseRow + step;
        const cy = screenY(r);
        if (cy < -30 || cy > H+30) continue;
        drawCorridorCell(screenX(b.col), cy, b.revealed && step >= b.decoyLen);
        if (b.revealed && step === b.decoyLen) drawTrapMark(screenX(b.col), cy, b.trapType);
      }
    }
    if (highlight) {
      for (const b of j.branches) {
        if (b.revealed) continue;
        const cx = screenX(b.col), cy = screenY(baseRow+1);
        ctx.save();
        ctx.globalAlpha = 0.55 + Math.sin(performance.now()/220)*0.25;
        ctx.strokeStyle = '#FFD98A'; ctx.lineWidth = 5;
        roundRect(cx-COL_W*0.42, cy-ROW_H*0.6, COL_W*0.84, ROW_H*1.15, 10);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawTrapMark(cx, cy, type){
    if (type === 'pit') {
      ctx.fillStyle = '#0d0805';
      ctx.beginPath(); ctx.ellipse(cx,cy,18,12,0,0,Math.PI*2); ctx.fill();
    } else if (type === 'wall') {
      ctx.fillStyle = '#6B5B4A';
      ctx.fillRect(cx-COL_W*0.36, cy-ROW_H*0.5, COL_W*0.72, ROW_H*0.5);
    } else {
      ctx.fillStyle = '#8B8378';
      ctx.beginPath(); ctx.arc(cx, cy-6, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.arc(cx-4, cy-10, 4, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawHintTrail(){
    if (!hintActive) return;
    ctx.save();
    const pulse = 0.5 + Math.sin(performance.now()/200)*0.3;
    ctx.strokeStyle = `rgba(255,217,138,${0.5+pulse*0.3})`;
    ctx.lineWidth = 6;
    ctx.beginPath();
    let started = false;
    for (const cell of maze.truePathCells) {
      if (cell.row < curRow - 1) continue;
      const cx = screenX(cell.col), cy = screenY(cell.row);
      if (cy < -60 || cy > H+60) continue;
      if (!started) { ctx.moveTo(cx,cy); started = true; } else ctx.lineTo(cx,cy);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawMole(){
    const cx = screenX(curCol), cy = MOLE_SCREEN_Y;
    const bob = Math.sin(performance.now()/110) * (phase==='auto'||phase==='branching'||phase==='retreating' ? 2.5 : 0);
    ctx.save();
    ctx.translate(cx, cy+bob);
    ctx.fillStyle = '#8B5F49';
    ctx.beginPath(); ctx.ellipse(-9,10,6,9,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,10,6,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#A9745B';
    ctx.beginPath(); ctx.ellipse(0,0,17,19,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7A5540';
    ctx.beginPath(); ctx.ellipse(-9,-15,5,6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,-15,5,6,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    drawBackground();
    if (!maze) { return; }
    if (phase === 'auto') {
      drawStraightAhead();
    } else if (phase === 'choose') {
      drawJunctionBranches(maze.junctions[activeJunctionIndex], true);
    } else if (phase === 'branching' || phase === 'trapped' || phase === 'retreating') {
      drawJunctionBranches(maze.junctions[activeJunctionIndex], false);
    }
    drawGoalIfVisible();
    drawHintTrail();
    drawMole();
  }

  // ---------------- input ----------------
  startOverlay.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => { ensureAudio(); startGame(btn.dataset.diff); });
  });
  retryBtn.addEventListener('click', () => { ensureAudio(); startGame(currentDiff); });
  restartBtn.addEventListener('click', () => {
    if (phase === 'idle' || phase === 'finished') return;
    ensureAudio(); startGame(currentDiff);
  });
  changeDiffLink.addEventListener('click', (e) => {
    e.preventDefault();
    resultOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, a')) return;
    if (phase !== 'choose') return;
    e.preventDefault();
    const rect = field.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width * W;
    const j = maze.junctions[activeJunctionIndex];
    let best = null, bestDist = Infinity;
    for (const b of j.branches) {
      const bx = screenX(b.col);
      const dist = Math.abs(bx - relX);
      if (dist < bestDist) { bestDist = dist; best = b; }
    }
    if (best) chooseBranch(best);
  }, { passive:false });

  // idle first paint
  resetRun('normal');
  drawBackground();
})();
</script>
</body>
</html>
